<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#AD4E15">
<script>try{document.documentElement.setAttribute("data-theme",JSON.parse(localStorage.getItem("ssb-v1:theme")||"\"light\""));}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쓰다보면">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<title>쓰다보면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 모바일 우선 한 칼럼 앱. 아래 탭바(오늘·현황·인증방·일정·관리), 넓은 화면에서는 현황이 2열 */
:root{
  /* 화사한 (기본): 따뜻한 흰 바탕 + 구운 오렌지 */
  --bg:#FFF7EF; --surface:#FFFFFF; --surface2:#FBF0E4; --ink:#35271C; --muted:#7A6454; --line:#EEDCC8;
  --accent:#AD4E15; --accent-ink:#FFFFFF; --accent-soft:#FFEFE2;
  --good:#2E7650; --good-soft:#E0F1E3; --warn:#8A6200; --warn-soft:#FFF0BF; --stamp:#B3321F;
  --font-display:'Nanum Myeongjo','Noto Serif KR',Georgia,serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
/* 어두운: 따뜻한 갈색 어둠 + 은은한 오렌지 */
:root[data-theme="dark"]{
  --bg:#1B1511; --surface:#271E18; --surface2:#32261E; --ink:#F7EBDD; --muted:#C7B09B; --line:#433227;
  --accent:#F0A45D; --accent-ink:#2B1706; --accent-soft:#4A3220;
  --good:#7BCB91; --good-soft:#1B3A28; --warn:#E8C35A; --warn-soft:#3F3512; --stamp:#FF8F6B;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:96px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display);font-weight:800;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}

header.top{padding:18px 0 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:26px;line-height:1.1}
header.top .sub{font-size:13px;color:var(--muted);margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;padding:3px 11px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex;gap:2px}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{margin:0 0 10px;font-size:17px}
.card h2.disp{font-size:19px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.grid2>*{min-width:0}

.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--stamp);border-color:var(--stamp);background:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:200px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}

/* 오늘 */
.today-label{font-size:30px;line-height:1.25;margin:6px 0 2px;text-wrap:balance}
.amount{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.checkbtn{width:100%;margin-top:14px;min-height:60px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.checkbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.checkbtn.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.checkbtn:disabled{opacity:.55;cursor:not-allowed}
.shot{margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.shot img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:var(--surface2)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.plain{background:var(--surface2);color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.15}
.kpi span{font-size:12px;color:var(--muted)}
.ringbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{width:112px;height:112px;flex:none}
.ring .bg{stroke:var(--surface2)} .ring .fg{stroke:var(--accent)}
.ring text{fill:var(--ink);font-family:var(--font-display);font-weight:800}

/* 달력 */
.cal{display:flex;flex-wrap:wrap;gap:4px}
.cal i{width:17px;height:17px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);display:block}
.cal i.d{background:var(--good);border-color:var(--good)}
.cal i.m{background:var(--warn-soft);border-color:var(--warn)}
.cal i.t{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line);background:var(--surface2)}
.legend i.d{background:var(--good);border-color:var(--good)} .legend i.m{background:var(--warn-soft);border-color:var(--warn)}

/* 순위 */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:8px 10px;border-radius:10px}
.rank li.me{background:var(--accent-soft)}
.rank .no{font-family:var(--font-display);font-weight:800;font-size:18px;text-align:center}
.rank .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .val{font-size:13px;color:var(--muted);text-align:right}
.rank .bar{grid-column:2 / 4;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.rank li.me .bar{background:var(--surface)}
.rank .bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.rank li:nth-child(-n+3) .no{color:var(--stamp)}

svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .bar{fill:var(--accent);opacity:.55} svg.chart .bar.last{opacity:1}
svg.chart text.v{fill:var(--ink);font-weight:700}

/* 인증방 */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface2);border-radius:12px;overflow:hidden;min-width:0}
.tile .img{aspect-ratio:1/1;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.tile img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.tile .cap{padding:6px 9px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 일정 */
.sched{list-style:none;margin:0;padding:0}
.sched li{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.sched li:last-child{border-bottom:0}
.sched li.today{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent}
.sched .dt{font-size:13px;color:var(--muted)} .sched .lb{font-weight:500;min-width:0}
.sched .lb small{color:var(--muted);font-weight:400;margin-left:6px}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:transparent}
.tick svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tick.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.tick:disabled{opacity:.4;cursor:not-allowed}

.empty{text-align:center;padding:28px 12px}
.empty h2{font-size:20px}
.notice{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.notice.announce{background:var(--accent-soft);color:var(--ink)}
.notice.announce small{display:block;color:var(--muted);margin-top:2px}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cheer{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.cheer svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cheer.on{background:var(--accent);color:var(--accent-ink)}
.cheer.on svg{fill:currentColor}
.cheer:disabled{opacity:.5;cursor:default}
.tile .cap{display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:normal}
.tile .cap .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cheerlist{list-style:none;margin:0;padding:0}
.cheerlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}
.cheerlist li:last-child{border-bottom:0}
.cheerlist .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li{grid-template-columns:28px minmax(0,1fr) auto 100px !important}
.rank .cheer{padding:3px 9px}
.rank .bar{grid-column:2 / 5 !important}
.rank .ch{text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;margin-left:6px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
.pillst{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pillst.ok{background:var(--good-soft);color:var(--good)}
.pillst.warn{background:var(--warn-soft);color:var(--warn)}
.sethead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sethead h2{margin:0}
.noticelist{list-style:none;margin:0;padding:0}
.noticelist li{padding:8px 0;border-bottom:1px solid var(--line)}
.noticelist li:last-child{border-bottom:0}
.noticelist small{color:var(--muted)}
#installbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
body.hasnav #installbar{bottom:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:0}
#installbar .in{max-width:740px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.22)}
#installbar img{width:38px;height:38px;border-radius:9px;flex:none}
#installbar .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
#installbar .tx b{display:block;font-size:14.5px}
#installbar button{border:0;border-radius:10px;padding:8px 13px;font-weight:700;font-size:14px;cursor:pointer}
#installbar .go{background:var(--accent);color:var(--accent-ink)}
#installbar .x{background:transparent;color:inherit;opacity:.75;padding:8px 6px;font-weight:500}
body.hasbar{padding-bottom:170px}
#sheet{position:fixed;inset:0;z-index:55;background:rgba(10,6,3,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet .box{width:100%;max-width:560px;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
#sheet h2{margin:0 0 4px;font-size:19px}
#sheet ol{margin:12px 0;padding-left:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px}
#sheet li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:15px}
#sheet li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.scrollx{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;background:var(--surface2)}
.days input{width:auto}

#lightbox{position:fixed;inset:0;background:rgba(5,10,20,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){
  .checkbtn{transition:background .2s,color .2s,border-color .2s}
  .rank .bar b{transition:width .5s}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="head"></header>
  <main id="view"></main>
</div>
<nav class="tabs" id="nav" aria-label="메뉴"><div class="in" id="navin"></div></nav>
<div id="lightbox" hidden></div>
<div id="installbar" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';

/* ===== 성경 66권 (장 수) ===== */
const BOOKS=[["창세기",50],["출애굽기",40],["레위기",27],["민수기",36],["신명기",34],["여호수아",24],["사사기",21],["룻기",4],["사무엘상",31],["사무엘하",24],["열왕기상",22],["열왕기하",25],["역대상",29],["역대하",36],["에스라",10],["느헤미야",13],["에스더",10],["욥기",42],["시편",150],["잠언",31],["전도서",12],["아가",8],["이사야",66],["예레미야",52],["예레미야애가",5],["에스겔",48],["다니엘",12],["호세아",14],["요엘",3],["아모스",9],["오바댜",1],["요나",4],["미가",7],["나훔",3],["하박국",3],["스바냐",3],["학개",2],["스가랴",14],["말라기",4],["마태복음",28],["마가복음",16],["누가복음",24],["요한복음",21],["사도행전",28],["로마서",16],["고린도전서",16],["고린도후서",13],["갈라디아서",6],["에베소서",6],["빌립보서",4],["골로새서",4],["데살로니가전서",5],["데살로니가후서",3],["디모데전서",6],["디모데후서",4],["디도서",3],["빌레몬서",1],["히브리서",13],["야고보서",5],["베드로전서",5],["베드로후서",3],["요한일서",5],["요한이서",1],["요한삼서",1],["유다서",1],["요한계시록",22]];
const FLAT=[]; BOOKS.forEach(([n,c],bi)=>{for(let i=1;i<=c;i++)FLAT.push([bi,i]);});
const BOOK_RE=new RegExp('('+BOOKS.map(b=>b[0]).sort((a,b)=>b.length-a.length).join('|')+')\\s*(\\d+)\\s*(?:장|편)?\\s*(?:[-–~]\\s*(\\d+)\\s*(?:장|편)?)?','g');

/* ===== 날짜 도구 ===== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const DOW=['일','월','화','수','목','금','토'];
const fmtKo=s=>{const d=parseYmd(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일('+DOW[d.getDay()]+')';};
const fmtShort=s=>{const d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate();};
const today=()=>ymd(new Date());
const fmtN=n=>Math.round(n*10)/10;

/* ===== 일정 입력 해석 ===== */
function guessUnits(label){
  const ms=[...label.matchAll(BOOK_RE)];
  if(!ms.length)return 1;

function parseSchedule(text){
  const items=[],errors=[],ctx={year:new Date().getFullYear(),lastMonth:0},seen=new Set();

    const line=raw.trim().replace(/^\|+|\|+$/g,'').trim();

    let parts,mm;
    if(line.includes('|'))parts=line.split('|').map(s=>s.trim());
    else if(line.includes('\t'))parts=line.split('\t').map(s=>s.trim());
    else if((mm=line.match(/^(\d{1,2}\s*월\s*\d{1,2}\s*일)\s+(.*)$/)))parts=[mm[1],mm[2]];
    else {const k=line.search(/\s/); parts=k<0?[line,'']:[line.slice(0,k),line.slice(k+1).trim()];}
    const d=parseDateToken(parts[0]||'',ctx);
    if(!d){errors.push((i+1)+'번째 줄: 날짜를 읽을 수 없어요 → '+line);return;}
    const t=(parts[1]||'').trim();
    if(!t){errors.push((i+1)+'번째 줄: 쓸 범위가 비어 있어요');return;}
    let n=parts[2]!==undefined&&parts[2]!==''?Number(parts[2]):guessUnits(t);
    if(!(n>0)){errors.push((i+1)+'번째 줄: 분량(장 수)이 올바르지 않아요');return;}
    if(seen.has(d)){errors.push((i+1)+'번째 줄: '+d+' 날짜가 중복돼요');return;}
    seen.add(d); items.push({d,t,n});
  });

  return {items,errors};
}

function parseLoose(text){
  const items=[],seen=new Set();
  const ym=text.match(/(20\d{2})\s*년|(20\d{2})\s*[-./]\s*\d/);
  const ctx={year:ym?+(ym[1]||ym[2]):new Date().getFullYear(),lastMonth:0};
  const DATE=/(?:(20\d{2})\s*[-./년]\s*)?(\d{1,2})\s*(?:[\/.]|월)\s*(\d{1,2})\s*일?(?!\s*\d)(?!\s*[장편])/;
  text.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim(); const m=DATE.exec(line); if(!m)return;
    const mo=+m[2],dy=+m[3]; if(mo<1||mo>12||dy<1||dy>31)return;
    if(m[1]){ctx.year=+m[1];ctx.lastMonth=mo;}else{if(mo<ctx.lastMonth)ctx.year++;ctx.lastMonth=mo;}
    const dt=new Date(ctx.year,mo-1,dy); if(dt.getMonth()!==mo-1)return;
    let label=(line.slice(0,m.index)+' '+line.slice(m.index+m[0].length))
      .replace(/\(\s*[월화수목금토일]\s*\)/g,' ').replace(/[월화수목금토일]요일/g,' ')
      .replace(/[|·•\t]+/g,' ').replace(/^\s*\d+\s*(주차|일차|회차)\s*/,' ')
      .replace(/(\d)\s+(장|편)/g,'$1$2').replace(/\s+/g,' ').replace(/^[\s\-–~:,.]+|[\s\-–~:,.]+$/g,'');
    if(![...label.matchAll(BOOK_RE)].length)return;
    const d=ymd(dt); if(seen.has(d))return; seen.add(d);
    items.push({d,t:label.slice(0,80),n:guessUnits(label)});
  });

  return {items};
}

async function pdfToText(file){
  const lib=await loadPdfjs();
  const doc=await lib.getDocument({data:await file.arrayBuffer(),cMapUrl:'vendor/cmaps/',cMapPacked:true}).promise;
  const out=[];
  for(let p=1;p<=Math.min(doc.numPages,60);p++){
    const tc=await (await doc.getPage(p)).getTextContent(),lines=[];
    tc.items.forEach(it=>{
      if(!it.str||!it.str.trim())return;
      const y=it.transform[5],x=it.transform[4];
      let L=lines.find(l=>Math.abs(l.y-y)<3); if(!L){L={y,parts:[]};lines.push(L);} L.parts.push({x,s:it.str});
    });
    lines.sort((a,b)=>b.y-a.y).forEach(L=>out.push(L.parts.sort((a,b)=>a.x-b.x).map(q=>q.s).join(' ')));
  }
  return out.join('\n');
}

function generate(o){
  const si=FLAT.findIndex(x=>x[0]===o.sb&&x[1]===o.sc),ei=FLAT.findIndex(x=>x[0]===o.eb&&x[1]===o.ec);
  if(si<0||ei<si)return {error:'끝나는 곳이 시작하는 곳보다 앞에 있어요.'};
  if(!o.days.length)return {error:'쓰는 요일을 하나 이상 골라 주세요.'};
  if(!o.start)return {error:'시작 날짜를 골라 주세요.'};
  const out=[];const d=parseYmd(o.start);
  for(let i=si;i<=ei;i+=o.per){
    const chunk=FLAT.slice(i,Math.min(i+o.per,ei+1));
    let guard=0; while(!o.days.includes(d.getDay())&&guard++<8)d.setDate(d.getDate()+1);

  }

}

function stats(items,done,t){
  let total=0,doneU=0,behindU=0,behindDays=0,doneDays=0,remDays=0;
  for(const it of items){
    total+=it.n; const ok=!!done[it.d];
    if(ok){doneU+=it.n;doneDays++;}
    if(it.d<t&&!ok){behindU+=it.n;behindDays++;}
    if(it.d>=t&&!ok)remDays++;
  }
  const past=items.filter(i=>i.d<=t); let idx=past.length-1;
  if(idx>=0&&past[idx].d===t&&!done[t])idx--;
  let streak=0; while(idx>=0&&done[past[idx].d]){streak++;idx--;}
  const remU=total-doneU;
  return {total,doneU,remU,pct:total?Math.round(doneU/total*100):0,behindU,behindDays,doneDays,remDays,streak,perDay:remDays?remU/remDays:0};
}

/* ===== 틀 ===== */
const TABS=[['today','오늘'],['status','현황'],['proofs','인증방'],['plan','일정'],['admin','관리']];
function go(tab){S.tab=tab;render();window.scrollTo(0,0);if(S.session&&Date.now()-(S.lastOk||0)>4000)refresh();}   // 탭을 옮길 때 오래된 내용이면 새로 받아 와요
function curTheme(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
function setTheme(k){
  document.documentElement.setAttribute('data-theme',k);lsSet(LS+':theme',k);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',k==='dark'?'#1B1511':'#AD4E15');
  renderHead();
}
function themeSeg(){
  const cur=curTheme();
  return h('div',{class:'seg',role:'group','aria-label':'화면 색'},[['light','화사한'],['dark','어두운']].map(([k,l])=>h('button',{type:'button','aria-pressed':String(cur===k),onclick:()=>setTheme(k)},l)));
}
function renderHead(){
  const hd=$('#head'); const t=today();
  renderInstallBar();
  hd.replaceChildren(
    h('div',{},h('h1',{class:'disp',text:'쓰다보면'}),h('div',{class:'sub',text:(S.plan&&S.plan.name)?S.plan.name:'성경필사 모임'})),
    h('div',{class:'hr'},themeSeg(),h('span',{class:'chip num',text:fmtKo(t)}),S.session?(()=>{const g=h('button',{type:'button',class:'gear','aria-label':'설정','aria-pressed':String(S.tab==='settings'),onclick:()=>go(S.tab==='settings'?'today':'settings')});g.innerHTML=ICONS.gear;return g;})():null));
}
function renderNav(){
  const nav=$('#navin'); nav.replaceChildren(...TABS.filter(([k])=>k!=='admin'||S.isAdmin).map(([k,l])=>{
    const b=h('button',{type:'button',onclick:()=>go(k),'aria-current':S.tab===k?'page':null});
    b.innerHTML=ICONS[k]; b.append(l); return b;}));
}
function render(){
  renderHead();
  const v=$('#view');
  if(!S.session){$('#nav').hidden=true;v.replaceChildren(authView());return;}
  $('#nav').hidden=false; renderNav();
  if(S.tab==='admin'&&S.isAdmin){if(v.firstChild!==adminRoot())v.replaceChildren(adminRoot());updateAdmin();return;}
  const fn={today:viewToday,status:viewStatus,proofs:viewProofs,plan:viewPlan,settings:viewSettings}[S.tab]||viewToday;
  v.replaceChildren(fn());
  if(S.tab==='plan'&&!S.scrolled){const e=v.querySelector('li.today')||null;if(e){S.scrolled=true;e.scrollIntoView({block:'center'});}}
}
let raf=0;
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const ae=document.activeElement;if(ae&&['rename','a-name','a-pin','notice-in'].includes(ae.id)&&!S.busy){return;}render();});}

/* ===== 시작 ===== */
function init(){
  const ses=lsGet(LS+':session'),data=lsGet(LS+':data');
  if(ses&&ses.id&&ses.token){
    S.session=ses;S.myId=ses.id;
    if(data&&data.plan){S.plan=data.plan;S.members=data.members||{};S.progress=data.progress||{};S.notice=(data.notice&&typeof data.notice==='object')?data.notice:null;S.notices=data.notices||[];S.staff=data.staff||[];S.cheers=data.cheers||[];S.role=data.role||(data.isAdmin?'admin':'member');S.isAdmin=!!data.isAdmin;S.planLoaded=true;}
  }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;schedule();});
  window.addEventListener('appinstalled',()=>{deferredInstall=null;closeSheet();schedule();});
  render();
  if(S.session)refresh();
  setInterval(()=>{if(!document.hidden)refresh();},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();schedule();}});
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
init();
})();
</script>
</body>
</html>
